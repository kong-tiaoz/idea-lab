<script>
(()=>{
'use strict';
const data=JSON.parse(document.getElementById('tree-data').textContent);
const svg=document.getElementById('map'),vp=document.getElementById('viewport'),stage=document.getElementById('stage');
const ns='http://www.w3.org/2000/svg',palette=['#278a82','#b17a3f','#537bba','#916da8','#c57064','#5e9270','#798699','#658eaa','#a68a55','#8a91a6','#9099a3'];
const all=[],byPath=new Map(),collapsed=new Set();let visible=[],links=[],selected=data,query='',hits=[],boxes=[],scale=1,tx=0,ty=0,drag=null,moved=false,foundOverlaps=0;
const ctx=document.createElement('canvas').getContext('2d');ctx.font='18px "Segoe UI","Microsoft YaHei",sans-serif';
function index(n,parent=null,depth=0,branch=0){n.parent=parent;n.depth=depth;n.branch=branch;all.push(n);byPath.set(n.path,n);if(depth===1&&n.children?.length)collapsed.add(n.path);(n.children||[]).forEach((c,i)=>index(c,n,depth+1,depth===0?i:branch));}
index(data);
function el(tag,attrs={},text){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,String(v));if(text!==undefined)e.textContent=text;return e;}
function linesFor(s){const lines=[];let line='';for(const ch of s){if(ctx.measureText(line+ch).width>310&&line){lines.push(line);line='';}line+=ch;}if(line)lines.push(line);return lines;}
function collect(n){visible.push(n);n.viewChildren=collapsed.has(n.path)?[]:(n.children||[]);n.viewChildren.forEach(c=>{links.push([n,c]);collect(c);});}
function arrange(){visible=[];links=[];collect(data);let leaves=[];function positions(n){if(!n.viewChildren.length){n.slot=leaves.length;leaves.push(n);}else{n.viewChildren.forEach(positions);n.slot=(n.viewChildren[0].slot+n.viewChildren.at(-1).slot)/2;}}positions(data);
 for(const n of visible){n.angle=n===data?0:-Math.PI/2+2*Math.PI*n.slot/Math.max(leaves.length,1);n.lines=linesFor(n.name);n.w=n===data?200:Math.max(80,...n.lines.map(x=>ctx.measureText(x).width))+28;n.h=n===data?86:n.lines.length*24+((n.children?.length)?33:10);}
 let step=285;
 for(let attempt=0;attempt<48;attempt++){
  boxes=visible.map(n=>{n.x=n===data?0:Math.cos(n.angle)*n.depth*step;n.y=n===data?0:Math.sin(n.angle)*n.depth*step;n.rx=n===data?-n.w/2:Math.cos(n.angle)>=0?16:-n.w-16;n.ry=-n.h/2;return {n,x:n.x+n.rx-5,y:n.y+n.ry-5,w:n.w+10,h:n.h+10};});
  foundOverlaps=0;for(let i=0;i<boxes.length;i++)for(let j=0;j<i;j++){const a=boxes[i],b=boxes[j];if(a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y)foundOverlaps++;}
  if(!foundOverlaps)break;step*=1.17;
 }
}
function paint(){arrange();vp.replaceChildren();
 for(const [a,b]of links){const mid=(a.depth+b.depth)*.5;const bx=Math.cos(b.angle)*mid*(Math.hypot(b.x,b.y)/b.depth),by=Math.sin(b.angle)*mid*(Math.hypot(b.x,b.y)/b.depth);vp.append(el('path',{class:'link',stroke:palette[b.branch%palette.length],d:`M ${a.x} ${a.y} Q ${bx} ${by} ${b.x} ${b.y}`}));}
 for(const n of visible){const color=palette[n.branch%palette.length];const g=el('g',{class:'node'+(n===data?' root':'')+(n===selected?' selected':'')+(query&&hits.includes(n)?' match':''),transform:`translate(${n.x} ${n.y})`,role:'button',tabindex:0,'aria-label':n.name+(n.children?.length?(collapsed.has(n.path)?'，展开目录':'，收起目录'):'，查看文件'),...(n.children?.length?{'aria-expanded':!collapsed.has(n.path)}:{})});g.append(el('title',{},n.path||'F:\idea-lab'));
  if(n!==data)g.append(el('circle',{r:n.type==='directory'?6:4,fill:n.type==='directory'?color:'#9aaab7'}));
  g.append(el('rect',{x:n.rx,y:n.ry,width:n.w,height:n.h,rx:n===data?14:8}));
  if(n!==data)g.append(el('rect',{x:n.rx,y:n.ry+10,width:3,height:n.h-20,rx:1,style:`fill:${color};stroke:none`}));
  const t=el('text',{x:n.rx+14,y:n.ry+(n===data?30:25)});n.lines.forEach((line,i)=>t.append(el('tspan',{x:n.rx+14,dy:i?24:0},line)));g.append(t);
  if(n===data)g.append(el('text',{x:n.rx+14,y:n.ry+59,class:'count'},'F:\\idea-lab'));
  else if(n.children?.length)g.append(el('text',{x:n.rx+14,y:n.ry+n.h-10,class:'count'},`${collapsed.has(n.path)?'＋':'−'} ${n.children.length} 项`));
  const act=()=>{show(n);if(n.children?.length){collapsed.has(n.path)?collapsed.delete(n.path):collapsed.add(n.path);paint();fit();}else paint();};
  g.addEventListener('click',()=>{if(!moved)act();});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});vp.append(g);
 }
 transform();
}
function transform(){vp.setAttribute('transform',`translate(${tx} ${ty}) scale(${scale})`);document.getElementById('zoom').textContent=Math.round(scale*100)+'%';}
function bounds(){return {left:Math.min(...boxes.map(b=>b.x)),top:Math.min(...boxes.map(b=>b.y)),right:Math.max(...boxes.map(b=>b.x+b.w)),bottom:Math.max(...boxes.map(b=>b.y+b.h))};}
function fit(){const b=bounds(),w=stage.clientWidth,h=stage.clientHeight;scale=Math.min(1.2,(w-75)/(b.right-b.left),(h-75)/(b.bottom-b.top));scale=Math.max(.025,scale);tx=(w-(b.left+b.right)*scale)/2;ty=(h-(b.top+b.bottom)*scale)/2;transform();}
function zoom(f,x=stage.clientWidth/2,y=stage.clientHeight/2){const k=Math.min(4,Math.max(.025,scale*f));tx=x-(x-tx)*k/scale;ty=y-(y-ty)*k/scale;scale=k;transform();}
function show(n){selected=n;document.getElementById('selected-name').textContent=n.name;document.getElementById('selected-path').textContent=n.path||'F:\idea-lab';document.getElementById('selected-purpose').textContent=n.purpose||'';document.getElementById('open').href='../'+(n.path?n.path.split('/').map(encodeURIComponent).join('/')+(n.type==='directory'?'/':''):'README.md');}
function focus(n){for(let p=n.parent;p;p=p.parent)collapsed.delete(p.path);show(n);paint();scale=1;tx=stage.clientWidth/2-n.x;ty=stage.clientHeight/2-n.y;transform();}
function search(){query=document.getElementById('search').value.trim().toLowerCase();hits=query?all.filter(n=>(n.name+' '+n.path+' '+(n.purpose||'')).toLowerCase().includes(query)):[];const panel=document.getElementById('results');panel.replaceChildren();panel.hidden=!query;document.getElementById('matches').textContent=query?`${hits.length} 项匹配`:'';
 for(const n of hits.slice(0,30)){const b=document.createElement('button'),s=document.createElement('strong'),p=document.createElement('span');s.textContent=n.name;p.textContent=n.path;b.append(s,p);b.addEventListener('click',()=>{focus(n);panel.hidden=true;});panel.append(b);}if(query&&!hits.length)panel.textContent='没有找到，试试项目标识或文件用途。';if(hits.length)focus(hits[0]);else paint();}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(Math.exp(-e.deltaY*.0012),e.clientX-r.left,e.clientY-r.top);},{passive:false});
svg.addEventListener('pointerdown',e=>{if(e.button!==0)return;moved=false;drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty};if(!e.target.closest('.node'))svg.setPointerCapture(e.pointerId);svg.classList.add('dragging');});
svg.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)moved=true;tx=drag.tx+dx;ty=drag.ty+dy;transform();});
function stop(){drag=null;svg.classList.remove('dragging');}svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);
document.getElementById('zoom-in').onclick=()=>zoom(1.25);document.getElementById('zoom-out').onclick=()=>zoom(.8);document.getElementById('fit').onclick=fit;
document.getElementById('expand').onclick=()=>{collapsed.clear();paint();fit();};document.getElementById('collapse').onclick=()=>{collapsed.clear();all.filter(n=>n.depth>=1&&n.children?.length).forEach(n=>collapsed.add(n.path));paint();fit();};
document.getElementById('search').addEventListener('input',search);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'&&hits.length){focus(hits[0]);document.getElementById('results').hidden=true;}if(e.key==='Escape'){e.target.value='';search();fit();}});
new ResizeObserver(fit).observe(stage);paint();show(data);fit();
window.mindmapDiagnostics=()=>({totalNodes:all.length,visibleNodes:visible.length,overlappingLabels:foundOverlaps,selectedPath:selected.path,searchMatches:hits.length,scale,tx,ty,paths:all.map(n=>n.path)});
})();
